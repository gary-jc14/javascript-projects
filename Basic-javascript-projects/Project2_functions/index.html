<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project 2 - Functions</title>
    <script src="JS/main.js"></script>
  </head>

  <body>
    <!-- Calls showMessage() from main.js when clicked -->
    <button onclick="showMessage()">Show Message</button>
    <!-- Starts empty; showMessage() fills in via document.getElementById("output") -->
    <p id="output"></p>

    <!-- Clicking the text itself runs the function, no button this time -->
    <p id="concatenate" onclick="concatenateMessage()">Click Here!</p>
  </body>
</html>
